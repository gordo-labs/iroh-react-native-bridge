name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: macos-14
    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install --global 'npm@^11.5.1'
          npm --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Set up Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Install package dependencies
        run: npm ci

      - name: Build iOS native artifacts
        run: npm run ubrn:ios

      - name: Build Android native artifacts
        run: npm run ubrn:android

      - name: Verify release package
        run: |
          npm --version
          npm run verify:release

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
